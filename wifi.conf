# FTSC11 WiFi / MQTT settings.
# Used by the PRODUCTION firmware only (deploy.py --fw app).
# The line-test firmware makes its own WiFi hotspot and ignores this file.
#
# Fill in and save before running the deploy script. Max 63 characters per value.

WIFI_SSID=
WIFI_PASS=

# Optional — MQTT / Home Assistant:
MQTT_URI=
MQTT_USER=
MQTT_PASS=

# Optional — device id (MQTT topic prefix), default "ftsc11":
DEVICE_ID=
